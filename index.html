<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Generador Administratiu de Targetes QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a252f; color: #333; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 25px; border-radius: 10px; max-width: 850px; width: 100%; display: flex; gap: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .form { flex: 1.3; }
        .qr-preview { flex: 0.7; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h2 { font-size: 1rem; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 4px; margin-top: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        h2:first-of-type { margin-top: 0; }
        label { font-weight: bold; font-size: 0.8rem; display: block; margin-top: 8px; color: #555; }
        input, textarea { width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 0.9rem; }
        textarea { resize: vertical; height: 50px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        button { background: #3498db; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 12px; font-size: 0.95rem; }
        button:hover { background: #2980b9; }
        button.translate { background: #f39c12; margin-top: 6px; padding: 6px 10px; font-size: 0.85rem; }
        button.translate:hover { background: #d35400; }
        #qrcode { margin: 15px 0; background: white; padding: 10px; border-radius: 4px; border: 1px solid #eee; }
        .hint { font-size: 0.75rem; color: #777; margin-top: 2px; }
    </style>
</head>
<body>

<div class="box">
    <div class="form">
        <h2>1. Servidor de Destí</h2>
        <label>URL base de GitHub Pages</label>
        <input type="text" id="baseUrl" value="https://ffernandezvargas.github.io/prueba-tarjetas-hub/">

        <h2>2. Dades Personals i Fotografia</h2>
        <label>Nom i Cognoms</label>
        <input type="text" id="nombre" value="Francisco J. Fernández">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>Telèfon</label>
                <input type="text" id="telefono" value="+34 934 974 000">
            </div>
            <div style="flex:1;">
                <label>Correu electrònic</label>
                <input type="email" id="email" value="fjfernandez@bellvitgehospital.cat">
            </div>
        </div>

        <label>URL de la Fotografia / Avatar (opcional)</label>
        <input type="text" id="imgUrl" placeholder="Ex. https://domini.cat/fotos/retrat.jpg">
        <span class="hint">Si es deixa en blanc, es generaran les inicials del nom.</span>

        <h2>3. Càrrec i Organització (Trilingüe)</h2>
        <label>Càrrec en Català</label>
        <input type="text" id="cargo_ca" placeholder="Ex. Tècnic de Disseny">
        <label>Organització en Català</label>
        <input type="text" id="org_ca" value="Hospital Universitari de Bellvitge">
        
        <button class="translate" onclick="traducirTodo()">Auto-traduir textos a ES i EN</button>
        
        <label style="margin-top:10px;">Traducció de Càrrec (ES / EN)</label>
        <div class="grid-3">
            <input type="text" id="cargo_es" placeholder="Càrrec ES">
            <input type="text" id="cargo_en" placeholder="Càrrec EN">
        </div>

        <label style="margin-top:10px;">Traducció d'Organització (ES / EN)</label>
        <div class="grid-3">
            <input type="text" id="org_es" value="Hospital Universitario de Bellvitge">
            <input type="text" id="org_en" value="Bellvitge University Hospital">
        </div>

        <h2>4. Observacions / Horaris (Trilingüe)</h2>
        <label>Text lliure en Català (horaris, ubicació, telèfon alternatiu...)</label>
        <textarea id="obs_ca" placeholder="Ex. Horari d'atenció: Dilluns a Divendres de 8h a 15h."></textarea>
        
        <label>Traducció d'Observacions (ES / EN)</label>
        <div class="grid-3">
            <input type="text" id="obs_es" placeholder="Observacions ES">
            <input type="text" id="obs_en" placeholder="Notes EN">
        </div>

        <button onclick="generarQR()">Generar Codi QR</button>
    </div>

    <div class="qr-preview">
        <h3>Vista Prèvia del QR</h3>
        <div id="qrcode"></div>
        <button id="btnDownload" style="display:none; background:#2ecc71;" onclick="descargarQR()">Descarregar Imatge QR</button>
    </div>
</div>

<script>
    async function traducirTexto(texto, targetLang) {
        if (!texto || texto.trim() === '') return '';
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=ca|${targetLang}`);
            const json = await res.json();
            return json.responseData.translatedText || texto;
        } catch (e) {
            return texto;
        }
    }

    async function traducirTodo() {
        const cargoCat = document.getElementById('cargo_ca').value;
        const obsCat = document.getElementById('obs_ca').value;

        if (!cargoCat && !obsCat) {
            alert('Introdueix primer el càrrec o les observacions en català.');
            return;
        }
        
        if (cargoCat) {
            document.getElementById('cargo_es').value = "Traduint...";
            document.getElementById('cargo_en').value = "Traduint...";
            document.getElementById('cargo_es').value = await traducirTexto(cargoCat, 'es');
            document.getElementById('cargo_en').value = await traducirTexto(cargoCat, 'en');
        }

        if (obsCat) {
            document.getElementById('obs_es').value = "Traduint...";
            document.getElementById('obs_en').value = "Traduint...";
            document.getElementById('obs_es').value = await traducirTexto(obsCat, 'es');
            document.getElementById('obs_en').value = await traducirTexto(obsCat, 'en');
        }
    }

    function generarQR() {
        const base = document.getElementById('baseUrl').value.trim();
        const n = document.getElementById('nombre').value;
        const t = document.getElementById('telefono').value;
        const e = document.getElementById('email').value;
        const img = document.getElementById('imgUrl').value.trim();

        const c_ca = document.getElementById('cargo_ca').value;
        const c_es = document.getElementById('cargo_es').value;
        const c_en = document.getElementById('cargo_en').value;

        const o_ca = document.getElementById('org_ca').value;
        const o_es = document.getElementById('org_es').value;
        const o_en = document.getElementById('org_en').value;

        const obs_ca = document.getElementById('obs_ca').value;
        const obs_es = document.getElementById('obs_es').value;
        const obs_en = document.getElementById('obs_en').value;

        const finalUrl = `${base}?n=${encodeURIComponent(n)}&t=${encodeURIComponent(t)}&e=${encodeURIComponent(e)}&img=${encodeURIComponent(img)}&c_ca=${encodeURIComponent(c_ca)}&c_es=${encodeURIComponent(c_es)}&c_en=${encodeURIComponent(c_en)}&o_ca=${encodeURIComponent(o_ca)}&o_es=${encodeURIComponent(o_es)}&o_en=${encodeURIComponent(o_en)}&obs_ca=${encodeURIComponent(obs_ca)}&obs_es=${encodeURIComponent(obs_es)}&obs_en=${encodeURIComponent(obs_en)}`;

        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';

        new QRCode(qrContainer, {
            text: finalUrl,
            width: 350,
            height: 350,
            correctLevel : QRCode.CorrectLevel.L
        });

        document.getElementById('btnDownload').style.display = 'block';
    }

    function descargarQR() {
        const img = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
        const enlace = document.createElement('a');
        enlace.href = img.src || img.toDataURL("image/png");
        enlace.download = `QR_${document.getElementById('nombre').value.replace(/\s+/g, '_')}.png`;
        enlace.click();
    }
</script>
</body>
</html>
